<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0614" />
      <stop offset="50%" stop-color="#190e2e" />
      <stop offset="100%" stop-color="#090512" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="100%" stop-color="#100920" />
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="960" fill="url(#bg)" />
  <circle cx="400" cy="450" r="360" fill="url(#glow)" />

  <!-- Decorative subtle grid lines -->
  <g stroke="#c084fc" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="960" />
    <line x1="720" y1="0" x2="720" y2="960" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="840" x2="800" y2="840" />
  </g>

  <!-- Main Luxury Pass Card -->
  <rect x="115" y="160" width="570" height="640" rx="34" fill="url(#cardGrad)" stroke="url(#lavenderGrad)" stroke-width="2.5" />
  <rect x="135" y="180" width="530" height="600" rx="24" fill="none" stroke="#e9d5ff" stroke-opacity="0.16" stroke-width="1" />

  <!-- Top Eyebrow -->
  <text x="400" y="245" text-anchor="middle" fill="#d8b4fe" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6">KD-XX GALLERY STUDIO</text>

  <!-- Cute Coffee Cup Icon -->
  <g transform="translate(320, 290)">
    <!-- Steam waves -->
    <path d="M52 24 C45 8, 60 2, 52 -12" fill="none" stroke="#f0abfc" stroke-width="4" stroke-linecap="round" />
    <path d="M80 20 C73 4, 88 -2, 80 -16" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <path d="M108 24 C101 8, 116 2, 108 -12" fill="none" stroke="#f0abfc" stroke-width="4" stroke-linecap="round" />
    <!-- Cup body -->
    <path d="M30 42 H130 L118 142 C116 156, 104 166, 90 166 H70 C56 166, 44 156, 42 142 Z" fill="#faf5ff" stroke="#c084fc" stroke-width="4" />
    <!-- Cup handle -->
    <path d="M126 62 H144 C156 62, 162 72, 160 86 C158 102, 146 110, 134 110 H122" fill="none" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round" />
    <!-- Lavender Sleeve -->
    <polygon points="36,74 124,74 119,124 41,124" fill="url(#lavenderGrad)" />
    <!-- Cute Sparkle on Cup -->
    <path d="M80 86 L84 96 L94 100 L84 104 L80 114 L76 104 L66 100 L76 96 Z" fill="#190e2e" />
  </g>

  <!-- Product Title -->
  <text x="400" y="535" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="4">TIP CHO KD</text>
  <text x="400" y="578" text-anchor="middle" fill="#e9d5ff" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="1">MỘT LY CÀ PHÊ ỦNG HỘ STUDIO &amp; TEST SEPAY</text>

  <!-- Price Pill -->
  <rect x="235" y="618" width="330" height="68" rx="34" fill="url(#lavenderGrad)" />
  <text x="400" y="662" text-anchor="middle" fill="#0d0618" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="2">2.000 VND</text>

  <!-- Footer perks -->
  <text x="400" y="732" text-anchor="middle" fill="#c4b5fd" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">0đ SHIPPING • 0đ VAT • VIETQR INSTANT</text>

  <!-- Corner sparkles -->
  <path d="M190 250 L195 264 L209 269 L195 274 L190 288 L185 274 L171 269 L185 264 Z" fill="#f0abfc" opacity="0.85" />
  <path d="M610 250 L614 260 L624 264 L614 268 L610 278 L606 268 L596 264 L606 260 Z" fill="#c084fc" opacity="0.85" />
  <path d="M190 700 L194 710 L204 714 L194 718 L190 728 L186 718 L176 714 L186 710 Z" fill="#c084fc" opacity="0.7" />
  <path d="M610 700 L615 714 L629 719 L615 724 L610 738 L605 724 L591 719 L605 714 Z" fill="#f0abfc" opacity="0.7" />
</svg>
